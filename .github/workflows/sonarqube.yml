name: SonarCloud Analysis

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: Tests and SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalar dependencias del frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 4. Ejecutar pruebas y generar cobertura
      - name: Run tests and generate coverage
        working-directory: frontend
        run: npm run test:coverage

      # 5. Verificar que existan pruebas y que el reporte LCOV tenga datos
      - name: Verify test coverage
        working-directory: frontend
        run: |
          echo "Verificando archivos de pruebas..."

          if ! find tests -type f -name "*.test.mjs" | grep -q .; then
            echo "ERROR: No se encontraron archivos de pruebas."
            exit 1
          fi

          echo "Verificando reporte LCOV..."

          if [ ! -s coverage/lcov.info ]; then
            echo "ERROR: El reporte LCOV está vacío o no existe."
            exit 1
          fi

          if ! grep -q "^SF:" coverage/lcov.info; then
            echo "ERROR: El reporte LCOV no contiene archivos fuente."
            exit 1
          fi

          echo "Archivos incluidos en el reporte:"
          grep "^SF:" coverage/lcov.info

          echo "Resumen de cobertura:"
          grep -E "^(LF|LH):" coverage/lcov.info

          echo "Reporte LCOV verificado correctamente."

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install backend and test dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-ci.lock

      - name: Run Python tests and generate coverage
        env:
          DATABASE_URL: postgresql://127.0.0.1:1/distribonilla_test
          VITE_SUPABASE_URL: http://127.0.0.1:1
          VITE_SUPABASE_PUBLISHABLE_KEY: isolated-test-placeholder
        run: |
          if [ -d backend/tests ] && find backend/tests -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            cd backend
            python -m coverage run --source=app,scripts -m pytest tests
            python -m coverage xml -o coverage.xml
            python -c "import xml.etree.ElementTree as ET; root = ET.parse('coverage.xml').getroot(); assert root.tag == 'coverage' and root.findall('.//class') and int(root.attrib['lines-valid']) > 0"
            cd ..
            echo 'SONAR_PYTHON_ARGS=-Dsonar.python.version=3.11 -Dsonar.exclusions=frontend/tests/**,backend/tests/** -Dsonar.python.coverage.reportPaths=backend/coverage.xml' >> "$GITHUB_ENV"
          else
            echo "No Python test files found. Python tests and coverage were not run."
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=anzagood1
            -Dsonar.projectKey=anzagood1_Distribonilla
            -Dsonar.projectName=Distribonilla
            -Dsonar.coverage.exclusions=frontend/tests/**,backend/alembic/**
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            ${{ env.SONAR_PYTHON_ARGS }}
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
