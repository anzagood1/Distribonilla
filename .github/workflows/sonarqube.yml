
name: SonarQube Analysis

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarqube:
    name: Static Code Analysis
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalar dependencias
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 4. Ejecutar pruebas y generar cobertura
      - name: Run unit tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      # 5. Verificar que LCOV exista y tenga contenido
      - name: Verify LCOV report
        run: |
          if [ ! -s frontend/coverage/lcov.info ]; then
            echo "Error: LCOV report was not generated or is empty."
            exit 1
          fi

          echo "LCOV report generated successfully."
          echo "Coverage report size:"
          wc -c frontend/coverage/lcov.info

      # 6. Ejecutar análisis de SonarCloud
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=anzagood1
            -Dsonar.projectKey=anzagood1_Distribonilla
            -Dsonar.projectName=Distribonilla
            -Dsonar.sources=frontend/src,backend
            -Dsonar.tests=frontend/tests
            -Dsonar.test.inclusions=frontend/tests/**/*.test.mjs
            -Dsonar.coverage.exclusions=frontend/tests/**
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.qualitygate.wait=true
